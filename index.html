/* Full-window layout: content spans the browser width; long text keeps its own reading measure. */
body { padding-left: max(16px, 15vw, env(safe-area-inset-left, 0px)); padding-right: max(16px, 15vw, env(safe-area-inset-right, 0px)); padding-block: 28px 32px; }

const scene = document.getElementById("scene");
const backBtn = document.getElementById("back");
const nextBtn = document.getElementById("next");
let trail = [];
let current = "start";
const seen = new Set();

const FIT_SCENES = ["short", "longInfo", "webtoonInfo", "drama", "bible"];
/* The synopsis box always shows at least half of the synopsis; if the screen can't hold that, the page scrolls a little instead. */
function sizeSynopsis() {
  const syn = scene.querySelector(".syn-scroll");
  if (!syn) return;
  const h2 = syn.querySelector("h2");
  const body = syn.querySelector(".syn-body");
  const half = Math.ceil(body.scrollHeight * 0.5 + (h2 ? h2.offsetHeight + 10 : 0));
  syn.style.setProperty("--syn-min", half + "px");
}
window.addEventListener("resize", sizeSynopsis);
if (document.fonts) document.fonts.ready.then(sizeSynopsis);
let curNoNext = false;
function render(id, push, noNext) {
  if (push) trail.push(current);
  current = id;
  curNoNext = !!noNext;
  const s = S[id];
  scene.dataset.m = s.m || "";
  scene.className = "scene" + (s.end ? " end" : "");
  scene.innerHTML = s.html;
  document.querySelector(".path").hidden = id === "cover";
  document.getElementById("home-btn").hidden = id === "cover";
  document.getElementById("nav").hidden = id === "cover";
  /* Work pages fit one screen: the synopsis scrolls inside its own box instead of the page. */
  const fit = FIT_SCENES.includes(id);
  document.body.classList.toggle("fit", fit);
  document.body.classList.toggle("fit-summary", id === "summary");
  document.body.classList.toggle("fit-bible", id === "bible");
  document.body.classList.toggle("on-start", ["start", "q2", "q3"].includes(id));
  document.body.classList.toggle("on-long", id === "long" || id === "webtoon");
  const syn = fit && scene.querySelector(".synopsis")?.closest(".section");
  if (syn) {
    const body = document.createElement("div");
    body.className = "syn-body";
    body.append(...[...syn.children].filter((el) => el.tagName !== "H2"));
    syn.append(body);
    syn.classList.add("syn-scroll");
    sizeSynopsis();
  }
  void scene.offsetWidth;
  scene.classList.add("enter");

  if (s.stop) seen.add(s.stop);
  document.querySelectorAll(".stop").forEach((el) => {
    el.classList.toggle("now", el.dataset.k === s.stop);
    el.classList.toggle("seen", seen.has(el.dataset.k) && el.dataset.k !== s.stop);
  });

  backBtn.hidden = trail.length === 0;
  if (s.next && !noNext) {
    nextBtn.hidden = false;
    nextBtn.innerHTML = s.nextLabel + " →" + (s.nextSub ? `<small>${s.nextSub}</small>` : "");
  } else {
    nextBtn.hidden = true;
  }

  const eps = document.getElementById("eps");
  if (eps) {
    eps.innerHTML = [1, 2, 3].map((n) => EPISODE_LOCAL
      ? `<a href="ep${n}.html" data-local-viewer target="_blank" rel="noopener">Episode ${n} (Korean)</a>`
      : (EPISODE_LINKS[n] ? A(EPISODE_LINKS[n], `Episode ${n} (Korean)`) : `<span>Episode ${n} (Korean)</span>`)).join("");
  }
  /* Phones: the summary diagram scrolls sideways; start it centered on the drama circle. */
  const sw = scene.querySelector(".sum-wrap");
  if (sw) sw.scrollLeft = (sw.scrollWidth - sw.clientWidth) / 2;
  window.scrollTo({ top: 0 });
}

scene.addEventListener("click", (e) => {
  const b = e.target.closest("[data-go]");
  if (!b) return;
  if (b.dataset.reset) { trail = []; seen.clear(); render(b.dataset.go, false); return; }
  render(b.dataset.go, true, b.classList.contains("more"));
});
document.getElementById("home-btn").addEventListener("click", () => { if (current !== "cover") render("cover", true); });
nextBtn.addEventListener("click", () => {
  const s = S[current];
  if (!s.next) return;
  if (s.nextReset) { trail = []; seen.clear(); render(s.next, false); return; }
  render(s.next, true);
});
backBtn.addEventListener("click", () => { if (trail.length) render(trail.pop(), false); });


const viewer = document.getElementById("viewer");
const vFrame = document.getElementById("viewer-frame");
function closeViewer() { viewer.hidden = true; vFrame.src = "about:blank"; document.body.classList.remove("viewer-open"); }
document.addEventListener("click", (e) => {
  if (!USE_POPUP) return;
  const a = e.target.closest('a[href*="drive.google.com/file/d/"], a[data-local-viewer]');
  if (!a || a.id === "viewer-open") return;
  e.preventDefault();
  if (a.hasAttribute("data-local-viewer")) {
    vFrame.src = a.getAttribute("href");
  } else {
    const m = a.href.match(/\/file\/d\/([^/?#]+)/);
    vFrame.src = "https://drive.google.com/file/d/" + m[1] + "/preview";
  }
  document.getElementById("viewer-open").href = a.href;
  document.getElementById("viewer-title").textContent = a.textContent;
  viewer.hidden = false;
  document.body.classList.add("viewer-open");
  document.getElementById("viewer-close").focus();
});
document.getElementById("viewer-close").addEventListener("click", closeViewer);
viewer.addEventListener("click", (e) => { if (e.target === viewer) closeViewer(); });
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !viewer.hidden) closeViewer(); });

/* Language switch: carry the current scene, back history and visited media to the other language's page. */
const LANG_KEY = "drcha-journey-state";
const langSwitch = document.getElementById("lang-switch");
if (langSwitch) {
  langSwitch.addEventListener("click", () => {
    try { sessionStorage.setItem(LANG_KEY, JSON.stringify({ current, trail, seen: [...seen], noNext: curNoNext })); } catch (err) {}
  });
}
function restoreState() {
  try {
    const raw = sessionStorage.getItem(LANG_KEY);
    if (!raw) return false;
    sessionStorage.removeItem(LANG_KEY);
    const st = JSON.parse(raw);
    if (!st || !S[st.current]) return false;
    trail = (st.trail || []).filter((k) => S[k]);
    (st.seen || []).forEach((k) => seen.add(k));
    render(st.current, false, st.noNext);
    return true;
  } catch (err) { return false; }
}
scene.addEventListener("keydown", (e) => {
  if (e.key !== "Enter" && e.key !== " ") return;
  const g = e.target.closest("g[data-go]");
  if (!g) return;
  e.preventDefault();
  render(g.dataset.go, true);
});
if (!restoreState()) render("cover", false);
</script>
