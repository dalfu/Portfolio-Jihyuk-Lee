<style>
/* Layout: one reading column; a four-stop media path on top, one scene in the middle, back/next at the bottom. Color is used only to tell the media apart. */
:root {
  --bg: #fbfbfc;
  --surface: #ffffff;

  --sub: #5a6072;
  --faint: #9aa0b0;
  --rule: #e4e6ec;
  --novel: #3d5a80;
  --webtoon: #5f5482;
  --drama: #14213d;
  --drama-on: #ffffff;
  --tint-novel: #e8edf3; --tint-webtoon: #ecebf2; --drama-fill: #14213d;
  --story: "Gowun Batang", "Noto Serif KR", "AppleMyungjo", serif;
  --ui: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
}
:root { color-scheme: light; }
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--ui); font-size: 15px; line-height: 1.6; word-break: keep-all; overflow-wrap: break-word;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 28px 40px;
}
.wrap { max-width: 680px; margin: 0 auto; display: flex; flex-direction: column; gap: 28px; }

.path { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.stop { display: flex; flex-direction: column; gap: 6px; font-size: 13.8px; color: var(--faint); min-width: 0; }
.stop .bar { height: 4px; border-radius: 2px; background: var(--rule); }
.stop .lab { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stop.seen .bar { background: var(--c); opacity: .35; }
.stop.now .bar { background: var(--c); opacity: 1; }
.stop.now .lab { color: var(--c); font-weight: 600; }
.stop[data-m="novel"] { --c: var(--novel); }
.stop[data-m="webtoon"] { --c: var(--webtoon); }
.stop[data-m="drama"] { --c: var(--drama); }

.scene { display: flex; flex-direction: column; gap: 22px; min-height: 360px; }
.scene.enter { animation: rise .35s ease-out; }
@keyframes rise { from { opacity: .4; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .scene.enter { animation: none; } }

.eyebrow { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; font-size: 13px; color: var(--sub); }
.eyebrow b { color: var(--c, var(--ink)); font-weight: 600; }
.scene[data-m="novel"] { --c: var(--novel); }
.scene[data-m="webtoon"] { --c: var(--webtoon); }
.scene[data-m="drama"] { --c: var(--drama); }
h1 { font-family: var(--story); font-weight: 700; font-size: clamp(24px, 5vw, 32px); line-height: 1.35; margin: 0; text-wrap: balance; }
.story { font-family: var(--story); font-size: 18px; line-height: 1.95; display: flex; flex-direction: column; gap: 14px; max-width: 34em; }
.story p { margin: 0; }

.question { font-family: var(--story); font-weight: 700; font-size: clamp(22px, 4.6vw, 28px); line-height: 1.5; margin: 0; text-wrap: balance; }
.choices { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.choice {
  font: inherit; text-align: left; cursor: pointer; background: var(--surface); color: var(--ink);
  border: 1px solid var(--rule); border-radius: 10px; padding: 16px 18px; display: flex; flex-direction: column; gap: 4px;
}
.choice:hover { border-color: var(--k); }
.choice:focus-visible, .nav button:focus-visible, .links a:focus-visible { outline: 2px solid var(--k, var(--ink)); outline-offset: 2px; }
.choice .ans { font-weight: 600; font-size: 17px; color: var(--k); }
.choice .to { font-size: 13px; color: var(--sub); }
.choice[data-m="novel"] { --k: var(--novel); }
.choice[data-m="webtoon"] { --k: var(--webtoon); }
.choice[data-m="drama"] { --k: var(--drama); }

.section { display: flex; flex-direction: column; gap: 10px; }
.section h2 { font-size: 13px; font-weight: 600; letter-spacing: .04em; color: var(--sub); margin: 0; }
.traits { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 20px; }
.traits li { padding: 10px 0; border-top: 1px solid var(--rule); display: flex; flex-direction: column; gap: 2px; }
.traits li b { font-weight: 600; }
.traits li span { color: var(--sub); font-size: 14px; }
.synopsis { font-family: var(--story); font-size: 17px; line-height: 1.9; margin: 0; max-width: 34em; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tag { font-size: 12.5px; padding: 3px 10px; border-radius: 999px; border: 1px dashed var(--faint); color: var(--sub); }
.links { display: flex; flex-wrap: wrap; gap: 8px; }
.links a, .links span {
  font-size: 14px; padding: 8px 14px; border-radius: 8px; border: 1px solid var(--c); color: var(--c); text-decoration: none;
}
.links span { border-style: dashed; color: var(--faint); border-color: var(--rule); }
.links a:hover { background: color-mix(in srgb, var(--c) 8%, transparent); }

.meta { display: flex; flex-wrap: wrap; gap: 6px 18px; margin: 0; font-size: 13px; color: var(--sub); }
.meta div { display: flex; gap: 6px; }
.meta dt { color: var(--faint); }
.meta dd { margin: 0; color: var(--ink); }
.logline { margin: 0; font-family: var(--story); font-size: 18px; line-height: 1.7; padding-left: 14px; border-left: 2px solid var(--c); }
.synopsis + .synopsis { margin-top: 4px; }
.more { align-self: flex-start; font: inherit; font-size: 14px; font-weight: 600; background: transparent; color: var(--c); border: 1px solid var(--c); border-radius: 999px; padding: 7px 18px; cursor: pointer; }
.more:hover { background: color-mix(in srgb, var(--c) 8%, transparent); }
.more:focus-visible { outline: 2px solid var(--c); outline-offset: 2px; }
.cover { display: flex; flex-direction: column; gap: 24px; padding-block: 4px; }
.cover-kicker { margin: 0; font-size: 12.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--sub); }
.cover-title { margin: 0; font-family: var(--story); font-weight: 700; font-size: clamp(32px, 7vw, 46px); line-height: 1.15; display: flex; flex-direction: column; gap: 8px; text-wrap: balance; }
.cover-title span { font-weight: 400; font-style: italic; font-size: clamp(19px, 4vw, 24px); color: var(--sub); }
.cover-title span { font-style: normal; }
.cover-author { margin: 0; font-size: 18px; font-weight: 500; }
.cover-meta { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 16px; font-size: 12.5px; color: var(--sub); padding-bottom: 12px; border-bottom: 1px solid var(--rule); }
.cover-meta b { color: var(--ink); font-weight: 600; }
.cover-lead { display: flex; flex-direction: column; gap: 14px; padding: 18px 0 4px; }
.cover-works { background: var(--surface); color: var(--ink); border: 1px solid var(--rule); border-radius: 10px; overflow: hidden; }
.cover-works summary { list-style: none; cursor: pointer; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 16px; }
.cover-works summary::-webkit-details-marker { display: none; }
.cover-works summary::after { content: "+"; font-size: 18px; line-height: 1; color: var(--sub); }
.cover-works[open] summary::after { content: "−"; }
.cover-works summary:focus-visible { outline: 2px solid var(--ink); outline-offset: -4px; }
.cover-works h2 { margin: 0; font-size: 13px; font-weight: 500; letter-spacing: .02em; color: var(--sub); }
.cover-works ol { list-style: none; margin: 0; padding: 0 8px 4px; }
.cover-works li + li { border-top: 1px solid var(--rule); }
.cover-work { width: 100%; font: inherit; text-align: left; cursor: pointer; background: transparent; color: var(--ink); border: 0; border-radius: 6px; padding: 10px 8px; display: grid; grid-template-columns: 7.5em minmax(0, 1fr) auto; align-items: baseline; gap: 10px; }
.cover-work:hover { background: color-mix(in srgb, var(--ink) 6%, transparent); }
.cover-work:focus-visible { outline: 2px solid var(--ink); outline-offset: -2px; }
.cover-work small { font-size: 12px; font-weight: 600; color: var(--c); }
.cover-work b { font-family: var(--story); font-size: 15.5px; font-weight: 700; min-width: 0; }
.cover-work span { font-size: 12px; color: var(--sub); white-space: nowrap; }
.cover-overview { display: block; margin: 0 8px 12px; padding: 10px 8px 0; border-top: 1px solid var(--rule); width: calc(100% - 16px); text-align: left; font: inherit; font-size: 13px; font-weight: 600; background: none; border-left: 0; border-right: 0; border-bottom: 0; color: var(--ink); cursor: pointer; }
.cover-overview:hover { text-decoration: underline; text-underline-offset: 3px; }
.cover .cover-start { font-size: 17px; padding: 16px 30px; border-radius: 10px; }
.cover .cover-works { margin-top: 28px; }
.cover-works:not([open]) summary { padding-block: 10px; }
@media (max-width: 520px) { .cover-work { grid-template-columns: minmax(0, 1fr) auto; } .cover-work small { grid-column: 1 / -1; } }
.cover-rights { margin: 6px 0 0; padding-top: 14px; border-top: 1px solid var(--rule); font-size: 12.5px; line-height: 1.65; color: var(--sub); display: flex; flex-direction: column; gap: 4px; }
.cover-note { margin: 0; font-family: var(--story); font-size: 18px; line-height: 1.75; max-width: 30em; }
.cover-start { align-self: flex-start; font: inherit; font-size: 15px; font-weight: 600; cursor: pointer; background: var(--ink); color: var(--bg); border: 0; border-radius: 8px; padding: 12px 20px; }
.cover-start:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
.sum-sub { margin: 0; color: var(--sub); font-size: 15px; }
.sum-wrap { overflow-x: auto; margin-inline: -4px; }
.sum-svg { display: block; width: 100%; min-width: 560px; height: auto; }
.sum-svg .s-band { font-family: var(--ui); font-size: 13px; font-weight: 600; }
.sum-svg .s-title { font-family: var(--story); font-size: 16px; font-weight: 700; }
.sum-svg .s-key { font-family: var(--ui); font-size: 11.5px; }
.sum-svg .s-btxt { font-family: var(--ui); font-size: 11px; font-weight: 600; }
.sum-svg .s-chip { font-family: var(--ui); font-size: 12.5px; font-weight: 600; }
.sum-svg .s-dtitle { font-family: var(--story); font-size: 21px; font-weight: 700; }
.sum-svg .s-dsub { font-family: var(--story); font-size: 13.5px; }
.sum-svg .s-dkey { font-family: var(--ui); font-size: 11px; }
.sum-svg .s-leg { font-family: var(--ui); font-size: 11px; }
.sum-svg .s-card { cursor: pointer; }
.sum-svg .s-card:hover > rect:first-child, .sum-svg .s-card:hover > circle { opacity: .92; }
.sum-svg .s-card:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.sum-hint { display: none; margin: 0; font-size: 12px; color: var(--faint); }
@media (max-width: 600px) { .sum-hint { display: block; } }
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 30px; margin-bottom: -12px; }
.topbtn, .topbar-slot a { display: inline-block; line-height: 1.5; font: inherit; font-size: 13px; line-height: 1.5; color: var(--sub); background: transparent; border: 1px solid var(--rule); border-radius: 999px; padding: 4px 12px; cursor: pointer; text-decoration: none; }
.topbtn:hover, .topbar-slot a:hover { color: var(--ink); border-color: var(--sub); }
.topbtn:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.topbar-slot { margin-left: auto; }
.end { align-items: flex-start; justify-content: center; }
.end h1 { font-family: var(--story); }

.nav { display: flex; justify-content: space-between; gap: 12px; border-top: 1px solid var(--rule); padding-top: 16px; }
.nav button {
  font: inherit; font-size: 14px; cursor: pointer; padding: 10px 16px; border-radius: 8px;
  background: transparent; color: var(--ink); border: 1px solid var(--rule);
}
.nav .next { border-color: var(--ink); font-weight: 600; margin-left: auto; text-align: right; }

@media (max-width: 520px) {
  .choices, .traits { grid-template-columns: 1fr; }

  .choice { padding: 14px 16px; }
  .story { font-size: 17px; }
}
.han { font-family: "Gowun Batang", serif; }

.houses { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin: 4px 0; }
.house { border: 1px solid var(--rule); border-radius: 10px; padding: 12px; display: flex; flex-direction: column; gap: 2px; background: var(--surface); }
.house .hj { font-family: "Gowun Batang", serif; font-size: 26px; line-height: 1.2; }
.house b { font-weight: 600; font-size: 14px; }

.moon { width: 44px; height: 44px; border-radius: 50%; border: 1.5px solid var(--ink); flex: none; }
.moon.waxing { background: linear-gradient(90deg, transparent 50%, var(--ink) 50%); }
.moon.waning { background: linear-gradient(90deg, var(--ink) 50%, transparent 50%); }
.moon-card div { display: flex; flex-direction: column; gap: 2px; min-width: 0; }

@media (max-width: 560px) { .houses { grid-template-columns: repeat(2, minmax(0, 1fr)); } .moons { grid-template-columns: 1fr; } }
.viewer { position: fixed; inset: 0; z-index: 50; background: rgba(10, 12, 20, .72); display: flex; align-items: center; justify-content: center;
  padding: max(12px, env(safe-area-inset-top, 0px)) max(12px, env(safe-area-inset-right, 0px)) max(12px, env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px)); }
.viewer-box { background: var(--surface); width: min(980px, 100%); height: 100%; max-height: 92vh; border-radius: 12px; display: flex; flex-direction: column; overflow: hidden; border: 1px solid var(--rule); }
.viewer-bar { display: flex; align-items: center; gap: 10px; padding: 10px 12px 10px 16px; border-bottom: 1px solid var(--rule); }

.viewer-bar a, .viewer-bar button { font: inherit; font-size: 13px; color: var(--ink); background: transparent; border: 1px solid var(--rule); border-radius: 8px; padding: 6px 12px; text-decoration: none; cursor: pointer; white-space: nowrap; }

/* Same layout as the English page (index_backup_2026-10-28.html). */

/* Full-window layout: content spans the browser width. */
body { padding-left: max(16px, 15vw, env(safe-area-inset-left, 0px)); padding-right: max(16px, 15vw, env(safe-area-inset-right, 0px)); padding-block: 28px 32px; }
.wrap { max-width: none; min-height: calc(100vh - 60px); }
.scene { flex: 1; }

.cover-lead { gap: clamp(10px, 1.8vh, 30px); padding-top: clamp(8px, 1vh, 40px); }

/* Work pages (body.fit): everything on one screen, only the synopsis box scrolls. Small screens keep normal page scrolling. */

}

        <p class="synopsis">닥터 차는 세계 종양학계에서 거침없이 떠오르는 스타다. 그러나 그 천재성 뒤에는 만성 불면에서 비롯된 각성제 중독이 숨어 있다. 교수 임용 면접 당일 아침, 그녀는 꿈에서 깬다. 알 것 같지만 누군지 떠오르지 않는 한 남자가 죽음 직전의 그녀를 구해 주는 꿈. 늘 그렇듯 알약을 삼키는 순간 코드 블루가 울리고, 하현은 중환자실을 향해 복도를 내달린다. 바로 그때, 그녀의 심장이 멈춘다.</p>
        <p class="synopsis">눈을 떠 보니 하현은 붉은 달 두 개가 걸린 전쟁터 한복판에 누워 있다. 이곳은 이월국. 최고의 무사만이 권력을 쥘 수 있고, 치유는 설 자리가 없는 나라. 패배한 병사에게는 스스로 목숨을 끊는 것만이 죽음까지 명예를 지키는 길이다. 그런 사정을 알 리 없는 하현은 죽어 가는 병사를 살리려 하고, 이 일로 이월국의 황태자 태강의 분노를 산다. 그런데 말다툼 내내 태강은 그녀를 낯선 이름으로 부른다. 내려다본 손과 몸은 그녀의 것이 아니다.</p>
        <p class="synopsis">하현은 전혀 다른 사람, 태강의 정혼자 달푸의 몸에서 깨어난 것이다. 연애 한 번 해 본 적 없는데 약혼이라니! 태강의 동생 주강은 달푸가 달라졌음을 단번에 알아채고 달콤한 말을 속삭인다. 그는 형의 왕좌뿐 아니라 정혼자까지 손에 넣으려 한다. 10년 전 황후의 죽음에 얽힌 진실을 밝히는 데 협력하면 한국으로 돌아가는 길을 알려 주겠다는 그의 제안에 하현은 흔들린다. 하지만 태강이 머릿속을 떠나지 않는다. 결국 하현은 치유의 금기를 깨고, 며칠째 그를 갉아먹던 느린 독을 치료한다. 살려야만 했다. 정이 들어서도, 마음이 흔들려서도 아니다. 절대로!</p>
        <p class="synopsis">독살범을 쫓을수록 하현은 이월국과 적국을 둘러싼 정치와 음모 깊숙이 빨려 든다. 그리고 경쟁국 흑월국과 이월국의 소외된 하층민 사이의 불온한 동맹을 밝혀낸다. 그들은 이월국을 통째로 삼키려 한다. 한편 주강과 태강 사이에서 아슬아슬한 줄타기를 하던 하현은, 헝클어진 하현의 몸을 하고 돌아온 진짜 달푸 때문에 한 방 크게 얻어맞는다. 사랑을 믿지 못하는 하현, 마음을 숨기지 못하는 태강, 그 틈을 노리는 주강. 네 사람의 얽힌 관계는 이월국을 배신한 설계자의 정체를 밝히는 여정 내내 요동친다.</p>

      <dl class="meta"><div><dt>형식</dt><dd>TV 드라마 · 50분 × 10부작</dd></div><div><dt>장르</dt><dd>판타지 메디컬</dd></div><div><dt>역할</dt><dd>극작가</dd></div></dl>
      <p class="logline">대한민국의 천재 심장외과의 닥터 차가 이월국의 어설픈 치유술사 달푸의 몸에 들어가, 무자비한 권력 다툼의 희생양이 된 친구를 구하려는 그녀의 여정에 휘말린다.</p>

      <div class="section">
        <h2>시놉시스</h2>
        <p class="synopsis">태초에 은사의 샘이 있었다. 모든 치유술의 근원인 이 성물은 일부 사람들에게 비범한 시각, 청각, 후각, 촉각을 내려 주었다. 그 감각이 얼마나 예민한지, 이들은 신경을 보고, 영혼의 목소리를 듣고, 염증의 냄새를 맡고, 손끝으로 피부 너머 근육과 뼈의 결함을 느꼈다. 우리 세계로 치면 각각 신경외과, 정신건강의학과, 내과, 정형외과다. 힘이 있는 곳에는 권력자가 있는 법. 이월국(二月國)에서는 치유탑을 중심으로 모인 네 치유 가문이 500년 넘게 서로를 견제하며 전통을 지켜 왔다. 그러던 어느 날 저주처럼 은사의 샘이 말라붙고, 혼돈의 시대가 찾아온다. 치유탑의 권위는 흔들리고, 백성의 병은 깊어지고, 왕실은 민심을 잃는다.</p>
        <p class="synopsis">몰락 직전의 향 가문. 그 후계자 달푸는 하늘 높은 기대에 한참 못 미치는 집안의 골칫덩이다. 그녀를 더욱 비참하게 하는 것은 백성의 영웅들을 배출한 해 가문의 천재, 소율을 향한 짝사랑이다. 사랑과 뒤엉킨 오랜 원망 끝에, 달푸는 전국 순회 치유를 떠나는 소율에게 모진 말을 던진다. “다시는 돌아오지 마.” 그때는 몰랐다. 정체 모를 세력이 보낸 늑대개 떼에 소율의 가문이 몰살당하고, 소율마저 흔적도 없이 사라지게 될 줄은.</p>
        <p class="synopsis">배후가 있다. 하지만 누구일까? 왕좌를 노리는 왕자? 공주? 아니면 경쟁 치유탑의 수장? 믿을 사람이 아무도 남지 않은 달푸는 성물 신월피리에 매달린다. 그녀의 절박한 주문이 소환한 것은 ‘대한민국’이라는 머나먼 곳에서 온 심장 치유사, 차하현. 소환 직전 하현은 수술 중이었다. 깨어나 보니 그는 낯선 옷차림의 사람들에게 둘러싸인 높은 첨탑 안에 있고, 더 기이하게도 달푸 향이라는 소녀의 몸에 들어 있다. 최연소 교수 임용을 코앞에 두고 소환된 하현은 하루라도 빨리 돌아가고 싶지만, 집으로 가는 유일한 길은 소환자의 소원을 들어주는 것뿐인 듯하다. 그렇게 한 몸에 깃든 두 영혼의, 소율을 찾아 이월국을 가로지르는 판타지 메디컬 여정이 시작된다.</p>

    html: `

        <p class="synopsis">두 개의 달이 뜨는 나라, 이월국(<span class="han">二月國</span>)은 쌍둥이 달에서 이름을 따왔다. 이월국은 무력이 곧 사회적 지위와 직결되는 무술 국가다. 타고난 재능은 국가의 것이며 오직 무술에만 쓰인다. 그래서 죽이는 기술은 명예가 되고 살리는 기술은 금기가 되어, 의술을 행하는 이들은 천민 취급을 받는다. 우리 시대, 우리 세계의 의사 차하현이 이월국에 소환되면서 그녀의 여정이 시작된다.</p>

const order = ["short", "long", "webtoon", "drama"];
const scene = document.getElementById("scene");
const backBtn = document.getElementById("back");
const nextBtn = document.getElementById("next");
let trail = [];
let current = "start";
const seen = new Set();

const FIT_SCENES = ["short", "longInfo", "webtoonInfo", "drama", "bible"];
/* The synopsis box always shows at least half of the synopsis; if the screen can't hold that, the page scrolls a little instead. */
function sizeSynopsis() {
  const syn = scene.querySelector(".syn-scroll");
  if (!syn) return;
  const h2 = syn.querySelector("h2");
  const body = syn.querySelector(".syn-body");
  const half = Math.ceil(body.scrollHeight * 0.5 + (h2 ? h2.offsetHeight + 10 : 0));
  syn.style.setProperty("--syn-min", half + "px");
}
window.addEventListener("resize", sizeSynopsis);
if (document.fonts) document.fonts.ready.then(sizeSynopsis);
let curNoNext = false;
function render(id, push, noNext) {
  if (push) trail.push(current);
  current = id;
  curNoNext = !!noNext;
  const s = S[id];
  scene.dataset.m = s.m || "";
  scene.className = "scene" + (s.end ? " end" : "");
  scene.innerHTML = s.html;
  document.querySelector(".path").hidden = id === "cover";
  document.getElementById("home-btn").hidden = id === "cover";
  document.getElementById("nav").hidden = id === "cover";
  /* Work pages fit one screen: the synopsis scrolls inside its own box instead of the page. */
  const fit = FIT_SCENES.includes(id);
  document.body.classList.toggle("fit", fit);
  document.body.classList.toggle("fit-summary", id === "summary");
  document.body.classList.toggle("fit-bible", id === "bible");
  document.body.classList.toggle("on-start", ["start", "q2", "q3"].includes(id));
  document.body.classList.toggle("on-long", id === "long" || id === "webtoon");
  const syn = fit && scene.querySelector(".synopsis")?.closest(".section");
  if (syn) {
    const body = document.createElement("div");
    body.className = "syn-body";
    body.append(...[...syn.children].filter((el) => el.tagName !== "H2"));
    syn.append(body);
    syn.classList.add("syn-scroll");
    sizeSynopsis();
  }
  void scene.offsetWidth;
  scene.classList.add("enter");

  if (s.stop) seen.add(s.stop);
  document.querySelectorAll(".stop").forEach((el) => {
    el.classList.toggle("now", el.dataset.k === s.stop);
    el.classList.toggle("seen", seen.has(el.dataset.k) && el.dataset.k !== s.stop);
  });

  backBtn.hidden = trail.length === 0;
  if (s.next && !noNext) {
    nextBtn.hidden = false;
    nextBtn.innerHTML = s.nextLabel + " →" + (s.nextSub ? `<small>${s.nextSub}</small>` : "");
  } else {
    nextBtn.hidden = true;
  }

  const eps = document.getElementById("eps");
  if (eps) {
    eps.innerHTML = [1, 2, 3].map((n) => EPISODE_LOCAL
      ? `<a href="ep${n}.html" data-local-viewer target="_blank" rel="noopener">${n}화 원고</a>`
      : (EPISODE_LINKS[n] ? A(EPISODE_LINKS[n], `${n}화 원고`) : `<span>${n}화 원고</span>`)).join("");
  }
  /* Phones: the summary diagram scrolls sideways; start it centered on the drama circle. */
  const sw = scene.querySelector(".sum-wrap");
  if (sw) sw.scrollLeft = (sw.scrollWidth - sw.clientWidth) / 2;
  window.scrollTo({ top: 0 });
}

scene.addEventListener("click", (e) => {
  const b = e.target.closest("[data-go]");
  if (!b) return;
  if (b.dataset.reset) { trail = []; seen.clear(); render(b.dataset.go, false); return; }
  render(b.dataset.go, true, b.classList.contains("more"));
});
document.getElementById("home-btn").addEventListener("click", () => { if (current !== "cover") render("cover", true); });
nextBtn.addEventListener("click", () => {
  const s = S[current];
  if (!s.next) return;
  if (s.nextReset) { trail = []; seen.clear(); render(s.next, false); return; }
  render(s.next, true);
});
backBtn.addEventListener("click", () => { if (trail.length) { const prev = trail.pop(); render(prev, false); } });


const viewer = document.getElementById("viewer");
const vFrame = document.getElementById("viewer-frame");
function closeViewer() { viewer.hidden = true; vFrame.src = "about:blank"; document.body.classList.remove("viewer-open"); }
document.addEventListener("click", (e) => {
  if (!USE_POPUP) return;
  const a = e.target.closest('a[href*="drive.google.com/file/d/"], a[data-local-viewer]');
  if (!a || a.id === "viewer-open") return;
  e.preventDefault();
  if (a.hasAttribute("data-local-viewer")) {
    vFrame.src = a.getAttribute("href");
  } else {
    const m = a.href.match(/\/file\/d\/([^/?#]+)/);
    vFrame.src = "https://drive.google.com/file/d/" + m[1] + "/preview";
  }
  document.getElementById("viewer-open").href = a.href;
  document.getElementById("viewer-title").textContent = a.textContent;
  viewer.hidden = false;
  document.body.classList.add("viewer-open");
  document.getElementById("viewer-close").focus();
});
document.getElementById("viewer-close").addEventListener("click", closeViewer);
viewer.addEventListener("click", (e) => { if (e.target === viewer) closeViewer(); });
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !viewer.hidden) closeViewer(); });

/* Language switch: carry the current scene, back history and visited media to the other language's page. */
const LANG_KEY = "drcha-journey-state";
const langSwitch = document.getElementById("lang-switch");
if (langSwitch) {
  langSwitch.addEventListener("click", () => {
    try { sessionStorage.setItem(LANG_KEY, JSON.stringify({ current, trail, seen: [...seen], noNext: curNoNext })); } catch (err) {}
  });
}
function restoreState() {
  try {
    const raw = sessionStorage.getItem(LANG_KEY);
    if (!raw) return false;
    sessionStorage.removeItem(LANG_KEY);
    const st = JSON.parse(raw);
    if (!st || !S[st.current]) return false;
    trail = (st.trail || []).filter((k) => S[k]);
    (st.seen || []).forEach((k) => seen.add(k));
    render(st.current, false, st.noNext);
    return true;
  } catch (err) { return false; }
}
scene.addEventListener("keydown", (e) => {
  if (e.key !== "Enter" && e.key !== " ") return;
  const g = e.target.closest("g[data-go]");
  if (!g) return;
  e.preventDefault();
  render(g.dataset.go, true);
});
if (!restoreState()) render("cover", false);
</script>
</body>
</html>
